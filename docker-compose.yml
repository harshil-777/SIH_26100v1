services:
  # Postgres runs on Supabase (see .env DATABASE_URL) — no local postgres service.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      SEED_DATA_DIR: /seed_data
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
      - ./WORKING DOCUMENTS:/seed_data:ro
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      SEED_DATA_DIR: /seed_data
      STORAGE_DIR: /app/storage
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
      - ./WORKING DOCUMENTS:/seed_data:ro
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules

volumes:
  web_node_modules:
