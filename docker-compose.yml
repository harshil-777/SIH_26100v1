services:
  # Local Postgres, so the stack runs self-contained and tests never touch a shared database.
  # api/worker use it only when DATABASE_URL is unset; a DATABASE_URL in .env (e.g. Supabase)
  # still wins. Host port 5433 avoids clashing with a Postgres already running on the machine.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gem}
      POSTGRES_DB: ${POSTGRES_DB:-gem_compliance}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gem} -d ${POSTGRES_DB:-gem_compliance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://gem:gem@postgres:5432/gem_compliance}
      REDIS_URL: redis://redis:6379/0
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      SEED_DATA_DIR: /seed_data
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
      - ./WORKING DOCUMENTS:/seed_data:ro
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://gem:gem@postgres:5432/gem_compliance}
      REDIS_URL: redis://redis:6379/0
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      SEED_DATA_DIR: /seed_data
      STORAGE_DIR: /app/storage
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
      - ./WORKING DOCUMENTS:/seed_data:ro
    depends_on:
      redis:
        condition: service_healthy

  # Full test suite, including the image-OCR tests that need Tesseract (installed in this image).
  # Only runs on demand:  docker compose run --rm test
  # Uses a throwaway database on the local postgres service, never DATABASE_URL.
  test:
    build: .
    profiles: ["test"]
    working_dir: /src
    command: sh -c "pip install -q --disable-pip-version-check -r requirements-dev.txt && python -m pytest"
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gem}:${POSTGRES_PASSWORD:-gem}@postgres:5432/gem_compliance_test
    volumes:
      - .:/src
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules

volumes:
  pg_data:
  web_node_modules:
